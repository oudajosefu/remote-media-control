[package]
name = "sofamote"
version = "0.9.0"
edition = "2024"
rust-version = "1.95"
authors = ["Joseph Odeh <odeh.joseph@gmail.com>"]
description = "Phone remote for laptop media"
license = "MIT"
homepage = "https://github.com/oudajosefu/sofamote"
repository = "https://github.com/oudajosefu/sofamote"

[[bin]]
name = "sofamote"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.6"
tray-icon = "0.24"
muda = "0.19"
qrcode = "0.14"
image = { version = "0.25", features = ["png"] }
local-ip-address = "0.6"
rand = "0.9"
hex = "0.4"
dirs = "6"
subtle = "2"
open = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
native-dialog = "0.9"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
png = "0.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "Sofamote"
identifier = "com.sofamote"
icon = ["assets/icon-active.png"]
category = "public.app-category.utilities"
copyright = "Copyright (c) 2026 Joseph Odeh"
short_description = "Phone remote for laptop media"
long_description = """
Phone remote for controlling video playback on a laptop over the local network.
Sofamote serves a phone-friendly PWA and translates taps into OS-level media
keystrokes for the focused browser window.
"""
osx_minimum_system_version = "12.0"
osx_info_plist_additional = { "LSUIElement" = "1" }

[package.metadata.deb]
name = "sofamote"
maintainer = "Joseph Odeh <odeh.joseph@gmail.com>"
copyright = "2026, Joseph Odeh"
depends = "$auto"
extended-description = """Phone remote for controlling video playback on a laptop over the local network.
Sofamote serves a phone-friendly PWA and translates taps into OS-level media keystrokes for the focused browser window."""
section = "utils"
assets = [
  [
    "target/release/sofamote",
    "usr/bin/",
    "755",
  ],
  [
    "assets/sofamote.desktop",
    "usr/share/applications/",
    "644",
  ],
]
